name: tests
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PARITY.md against the code of every front end
        run: python3 tools/parity.py --diff "${{ github.event.pull_request.base.sha || github.event.before }}"
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Shared cases (spec/cases) on the Android app's code
        run: android/test.sh
      - name: Compiles (-Werror), with a throwaway key
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-25" "build-tools;34.0.0" > /dev/null
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.keystore" -alias app -keyalg RSA -keysize 2048 \
            -validity 2 -storepass throwaway -keypass throwaway -dname "CN=CI" > /dev/null
          BUILD_TOOLS=34.0.0 KEYSTORE="$RUNNER_TEMP/throwaway.keystore" KEYPASS=throwaway android/build.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the in-box .NET 4.8 toolchain and run the tests (incl. spec/cases)
        shell: cmd
        run: windows\build.cmd test
